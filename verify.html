
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEDFAH - Vérification de carte</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }
    .container {
      max-width: 620px;
      margin: 30px auto;
      background: white;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 4px 18px #00000012;
    }
    h1 { color: #14532d; font-size: 24px; }
    p { line-height: 1.5; }
    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border-radius: 8px;
      font-size: 16px;
    }
    input { border: 1px solid #cbd5e1; }
    button {
      border: 0;
      background: #166534;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .back { background: #475569; }
    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }
    .found { background: #f0fdf4; border: 1px solid #86efac; }
    .not-found, .error {
      background: #fff7ed;
      border: 1px solid #fdba74;
    }
    .row { margin: 10px 0; }
    .label { font-weight: bold; }
    .small { color: #64748b; font-size: 13px; }
  </style>
</head>
<body>
  <main class="container">
    <h1>Vérification de carte MEDFAH</h1>
    <p>Antre nimewo kat pèrsévérance a oswa kòd manm nan.</p>

    <form id="verifyForm">
      <input
        id="cardInput"
        type="search"
        placeholder="Nimewo kat oswa kòd manm"
        autocomplete="off"
        required
      >
      <button type="submit">Vérifier la carte</button>
    </form>

    <div id="result" role="status" aria-live="polite" hidden></div>

    <button class="back" type="button"
      onclick="window.location.href='index.html'">
      Retour à l'accueil
    </button>

    <p class="small">
      MEDFAH — Vérification dans la base de données.
    </p>
  </main>

  <script src="config.js"></script>
  <script>
    const form = document.getElementById("verifyForm");
    const input = document.getElementById("cardInput");
    const result = document.getElementById("result");

    function showMessage(message, type) {
      result.className = type;
      result.textContent = message;
      result.hidden = false;
    }

    function addRow(parent, label, value) {
      const row = document.createElement("div");
      row.className = "row";

      const title = document.createElement("span");
      title.className = "label";
      title.textContent = label + " : ";

      const content = document.createElement("span");
      content.textContent =
        value === null || value === undefined || value === ""
          ? "Non renseigné"
          : String(value);

      row.append(title, content);
      parent.appendChild(row);
    }

    async function searchField(field, value) {
      const base = window.SUPABASE_URL;
      const key = window.SUPABASE_ANON_KEY;

      const params = new URLSearchParams({
        select: "nom,prenom,assemblee,numero_carte,code,status",
        [field]: "eq." + value,
        limit: "1"
      });

      const response = await fetch(
        base + "/rest/v1/membre_infos?" + params.toString(),
        {
          headers: {
            apikey: key,
            Authorization: "Bearer " + key
          }
        }
      );

      if (!response.ok) {
        throw new Error("Supabase HTTP " + response.status);
      }

      return await response.json();
    }

    async function verifyCard(value) {
      result.hidden = false;
      result.className = "";
      result.textContent = "Vérification en cours...";

      try {
        if (!window.SUPABASE_URL ||
            !window.SUPABASE_ANON_KEY) {
          throw new Error("Configuration Supabase manquante.");
        }

        let rows = await searchField("numero_carte", value);

        if (!rows.length) {
          rows = await searchField("code", value);
        }

        if (!rows.length) {
          showMessage(
            "Aucun membre ne correspond à ce numéro de carte ou à ce code.",
            "not-found"
          );
          return;
        }

        const member = rows[0];

        result.className = "found";
        result.replaceChildren();

        const heading = document.createElement("h2");
        heading.textContent = "Carte trouvée dans la base MEDFAH";
        result.appendChild(heading);

        addRow(result, "Nom", member.nom);
        addRow(result, "Prénom", member.prenom);
        addRow(result, "Assemblée", member.assemblee);
        addRow(result, "N° carte", member.numero_carte);
        addRow(result, "Code", member.code);
        addRow(result, "Statut enregistré", member.status);

        const note = document.createElement("p");
        note.className = "small";
        note.textContent =
          "Verifye estati manm nan dapre règ ofisyèl MEDFAH yo. Rezilta sa a konfime sèlman enfòmasyon ki jwenn nan bazdone a.";
        result.appendChild(note);

      } catch (error) {
        console.error(error);
        showMessage(
          "Verifikasyon an pa reyisi. Verifye koneksyon Supabase ak dwa aksè tab la, epi eseye ankò.",
          "error"
        );
      }
    }

    form.addEventListener("submit", function(event) {
      event.preventDefault();
      const value = input.value.trim();

      if (value) {
        verifyCard(value);
      }
    });

    const params = new URLSearchParams(window.location.search);
    const initialValue = params.get("q");

    if (initialValue) {
      input.value = initialValue;
      verifyCard(initialValue);
    }
  </script>
</body>
</html>
