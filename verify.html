
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vérification carte MEDFAH</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;font-family:Arial,sans-serif;background:#f1f5f9;color:#1e293b}
.container{max-width:620px;margin:30px auto;background:white;padding:24px;border-radius:14px;box-shadow:0 4px 18px #0002}
h1{color:#14532d;font-size:24px}
input,button{width:100%;padding:13px;margin-top:10px;border-radius:8px;font-size:16px}
input{border:1px solid #cbd5e1}
button{border:0;background:#166534;color:white;font-weight:bold;cursor:pointer}
.back{background:#475569}
#result{margin-top:20px;padding:15px;border-radius:8px;overflow-wrap:anywhere}
.found{background:#f0fdf4;border:1px solid #86efac}
.not-found,.error{background:#fff7ed;border:1px solid #fdba74}
.row{margin:10px 0}
.label{font-weight:bold}
.small{color:#64748b;font-size:13px}
</style>
</head>
<body>

<main class="container">
<h1>Vérification de carte MEDFAH</h1>
<p>Antre nimewo kat la, kòd manm nan oswa eskane QR Code la.</p>

<form id="verifyForm">
<input id="cardInput" type="search"
placeholder="Nimewo kat oswa code membre"
autocomplete="off" required>
<button type="submit">Vérifier la carte</button>
</form>

<div id="result" role="status" aria-live="polite" hidden></div>

<button class="back" type="button"
onclick="window.location.href='index.html'">
Retour à l'accueil
</button>

<p class="small">MEDFAH — Vérification officielle.</p>
</main>

<script src="config.js"></script>
<script>
const form=document.getElementById("verifyForm");
const input=document.getElementById("cardInput");
const result=document.getElementById("result");

function showMessage(message,type){
 result.className=type;
 result.textContent=message;
 result.hidden=false;
}

function addRow(parent,label,value){
 const row=document.createElement("div");
 row.className="row";

 const title=document.createElement("span");
 title.className="label";
 title.textContent=label+" : ";

 const content=document.createElement("span");
 content.textContent=value || "Non renseigné";

 row.append(title,content);
 parent.appendChild(row);
}

async function verifyCard(value){
 result.hidden=false;
 result.className="";
 result.textContent="Vérification en cours...";

 try{
  if(!window.SUPABASE_URL || !window.SUPABASE_ANON_KEY){
   throw new Error("Configuration Supabase manquante.");
  }

  const params=new URLSearchParams({
   select:"nom,prenom,numero_carte,code,statut",
   or:`(qr_token.eq.${value},numero_carte.eq.${value},code.eq.${value})`,
   limit:"1"
  });

  const response=await fetch(
   window.SUPABASE_URL+"/rest/v1/membre_infos?"+params.toString(),
   {
    headers:{
     apikey:window.SUPABASE_ANON_KEY,
     Authorization:"Bearer "+window.SUPABASE_ANON_KEY
    }
   }
  );

  if(!response.ok){
   throw new Error("Erreur Supabase : "+response.status);
  }

  const rows=await response.json();

  if(!rows.length){
   showMessage(
    "Aucune carte valide trouvée dans la base MEDFAH.",
    "not-found"
   );
   return;
  }

  const member=rows[0];

  result.className="found";
  result.replaceChildren();

  const heading=document.createElement("h2");
  heading.textContent="✓ Carte trouvée dans la base MEDFAH";
  result.appendChild(heading);

  addRow(result,"Nom",member.nom);
  addRow(result,"Prénom",member.prenom);
  addRow(result,"N° carte",member.numero_carte);
  addRow(result,"Code membre",member.code);
  addRow(result,"Statut",member.statut);

  const note=document.createElement("p");
  note.className="small";
  note.textContent=
   "Cette vérification confirme que le code correspond à un membre enregistré dans la base MEDFAH.";
  result.appendChild(note);

 }catch(error){
  console.error(error);
  showMessage(
   "Vérification impossible. Vérifiez les autorisations Supabase. "+error.message,
   "error"
  );
 }
}

form.addEventListener("submit",function(event){
 event.preventDefault();
 const value=input.value.trim();
 if(value) verifyCard(value);
});

const params=new URLSearchParams(window.location.search);
const token=params.get("qr_token");
const q=params.get("q");

if(token || q){
 const value=token || q;
 input.value=token ? "QR Code détecté" : value;
 if(token) input.disabled=true;
 verifyCard(value);
}
</script>
</body>
</html>
