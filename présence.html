
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MEDFAH - Gestion des présences</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 18px; font-family: Arial, sans-serif; color: #1e293b; background: #f1f5f9; }
    main { max-width: 680px; margin: 20px auto; padding: 22px; background: white; border-radius: 14px; box-shadow: 0 4px 18px #00000012; }
    h1 { color: #14532d; font-size: 25px; }
    label { display: block; margin-top: 18px; font-weight: bold; }
    input, select, button { width: 100%; padding: 13px; margin-top: 8px; border-radius: 8px; font-size: 16px; }
    input, select { border: 1px solid #cbd5e1; background: white; }
    button { border: 0; background: #166534; color: white; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .secondary { background: #475569; }
    .notice { margin-top: 18px; padding: 14px; border-radius: 8px; overflow-wrap: anywhere; }
    .success { background: #dcfce7; color: #166534; }
    .error { background: #ffedd5; color: #9a3412; }
    .member { padding: 14px; margin-top: 16px; border: 1px solid #cbd5e1; border-radius: 8px; }
    .muted { color: #64748b; font-size: 14px; line-height: 1.5; }
  </style>
</head>
<body>
<main>
  <h1>Présences — MEDFAH</h1>
  <p>Choisissez un service, recherchez le membre et enregistrez sa présence.</p>

  <label for="session">Service ouvert</label>
  <select id="session"><option value="">Chargement...</option></select>
  <button id="reloadSessions" class="secondary" type="button">Actualiser les services</button>

  <label for="memberCode">Code du membre ou numéro de carte</label>
  <input id="memberCode" type="search" placeholder="Saisir le code ou le numéro de carte" autocomplete="off">
  <button id="searchMember" type="button">Rechercher le membre</button>

  <div id="memberResult" class="member" hidden></div>

  <label for="attendanceStatus">Statut de présence</label>
  <select id="attendanceStatus">
    <option value="présent">Présent</option>
    <option value="en_retard">En retard</option>
  </select>

  <button id="saveAttendance" type="button" disabled>Enregistrer la présence</button>
  <div id="message" role="status" aria-live="polite"></div>

  <p class="muted">
    Seuls les services ouverts de la date du jour sont affichés.
    Les absences ne sont pas attribuées automatiquement dans cette version.
  </p>

  <button class="secondary" type="button" onclick="location.href='index.html'">Retour à l'accueil</button>
</main>

<script>
(() => {
  const url = window.SUPABASE_URL;
  const key = window.SUPABASE_ANON_KEY;

  const sessionSelect = document.getElementById("session");
  const memberInput = document.getElementById("memberCode");
  const memberResult = document.getElementById("memberResult");
  const statusSelect = document.getElementById("attendanceStatus");
  const saveButton = document.getElementById("saveAttendance");
  const message = document.getElementById("message");

  let client = null;
  let selectedMember = null;

  if (url && key && window.supabase) {
    client = window.supabase.createClient(url, key);
  }

  function showMessage(text, type = "") {
    message.className = type ? "notice " + type : "notice";
    message.textContent = text;
  }

  async function headers() {
    if (!client) throw new Error("Configuration Supabase indisponible.");

    const { data, error } = await client.auth.getSession();
    if (error) throw error;

    if (!data.session) {
      throw new Error("Session administrateur absente. Connectez-vous dans Administration.");
    }

    return {
      apikey: key,
      Authorization: "Bearer " + data.session.access_token,
      "Content-Type": "application/json"
    };
  }

  async function requestTable(table, params, options = {}) {
    const h = await headers();
    const response = await fetch(url + "/rest/v1/" + table + "?" + params.toString(), {
      method: options.method || "GET",
      headers: {
        ...h,
        ...(options.method === "POST" ? { Prefer: "return=representation" } : {})
      },
      body: options.body ? JSON.stringify(options.body) : undefined
    });

    if (!response.ok) {
      const details = await response.text();
      console.error(table, response.status, details);
      throw new Error("Erreur Supabase (" + response.status + "). " + details);
    }

    if (response.status === 204) return [];
    return response.json();
  }

  function dateHaiti() {
    const parts = new Intl.DateTimeFormat("en-CA", {
      timeZone: "America/Port-au-Prince",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).formatToParts(new Date());

    const get = type => parts.find(p => p.type === type).value;
    return get("year") + "-" + get("month") + "-" + get("day");
  }

  async function loadSessions() {
    sessionSelect.innerHTML = '<option value="">Chargement...</option>';

    try {
      const params = new URLSearchParams({
        select: "id,nom_services,date_service,heure_debut,heure_fin,statut",
        date_service: "eq." + dateHaiti(),
        statut: "eq.ouvert",
        order: "heure_debut.asc"
      });

      const sessions = await requestTable("sessions_presence", params);
      sessionSelect.replaceChildren();

      const first = document.createElement("option");
      first.value = "";
      first.textContent = sessions.length ? "Choisir un service" : "Aucun service ouvert aujourd'hui";
      sessionSelect.appendChild(first);

      sessions.forEach(s => {
        const option = document.createElement("option");
        option.value = s.id;
        option.textContent = s.nom_services + " — " + s.heure_debut + " à " + s.heure_fin;
        sessionSelect.appendChild(option);
      });
    } catch (e) {
      sessionSelect.innerHTML = '<option value="">Erreur de chargement</option>';
      showMessage(e.message, "error");
    }
  }

  async function searchMember() {
    selectedMember = null;
    saveButton.disabled = true;
    memberResult.hidden = true;

    const value = memberInput.value.trim();
    if (!value) {
      showMessage("Saisissez le code du membre ou le numéro de carte.", "error");
      return;
    }

    try {
      for (const field of ["numero_carte", "code"]) {
        const params = new URLSearchParams({
          select: "id,nom,prenom,code,numero_carte,statut",
          [field]: "eq." + value,
          limit: "1"
        });

        const rows = await requestTable("membre_infos", params);
        if (rows.length) {
          selectedMember = rows[0];
          break;
        }
      }

      if (!selectedMember) {
        showMessage("Aucun membre trouvé avec ce code ou numéro de carte.", "error");
        return;
      }

      memberResult.replaceChildren();

      const name = document.createElement("strong");
      name.textContent = (selectedMember.nom || "") + " " + (selectedMember.prenom || "");
      memberResult.appendChild(name);

      const details = document.createElement("p");
      details.textContent = "Code : " + (selectedMember.code || "—") +
        " | Carte : " + (selectedMember.numero_carte || "—");
      memberResult.appendChild(details);

      memberResult.hidden = false;
      saveButton.disabled = false;
      showMessage("Membre identifié. Vérifiez le service avant d'enregistrer.", "success");
    } catch (e) {
      showMessage(e.message, "error");
    }
  }

  async function saveAttendance() {
    if (!sessionSelect.value || !selectedMember) {
      showMessage("Choisissez un service et recherchez un membre.", "error");
      return;
    }

    saveButton.disabled = true;

    try {
      const duplicateParams = new URLSearchParams({
        select: "id",
        session_id: "eq." + sessionSelect.value,
        membre_id: "eq." + selectedMember.id,
        limit: "1"
      });

      const existing = await requestTable("presences_eglise", duplicateParams);

      if (existing.length) {
        showMessage("Ce membre est déjà enregistré pour ce service.", "error");
        return;
      }

      const insertParams = new URLSearchParams();
      await requestTable("presences_eglise", insertParams, {
        method: "POST",
        body: {
          session_id: Number(sessionSelect.value),
          membre_id: Number(selectedMember.id),
          heure_pointage: new Date().toISOString(),
          statut: statusSelect.value,
          mode_pointage: "manuel",
          observation: null
        }
      });

      showMessage("Présence enregistrée avec succès.", "success");
      memberInput.value = "";
      memberResult.hidden = true;
      selectedMember = null;
    } catch (e) {
      showMessage(e.message, "error");
    } finally {
      saveButton.disabled = !selectedMember;
    }
  }

  document.getElementById("reloadSessions").addEventListener("click", loadSessions);
  document.getElementById("searchMember").addEventListener("click", searchMember);
  saveButton.addEventListener("click", saveAttendance);

  memberInput.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      e.preventDefault();
      searchMember();
    }
  });

  sessionSelect.addEventListener("change", () => {
    selectedMember = null;
    memberResult.hidden = true;
    saveButton.disabled = true;
  });

  loadSessions();
})();
</script>
</body>
</html>
