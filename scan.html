<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eskane QR Code - MEDFAH</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      margin: 0;
      padding: 20px;
      color: #263238;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 440px;
      background: #fff;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,.09);
      text-align: center;
      margin-top: 20px;
    }
    h1 { color: #0d47a1; font-size: 1.45rem; }
    #reader {
      width: 100%;
      margin-top: 16px;
      overflow: hidden;
      border-radius: 10px;
    }
    #result {
      margin-top: 16px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      background: #0d47a1;
      color: #fff;
      border: 0;
      border-radius: 7px;
      font-size: 16px;
      text-decoration: none;
      margin-top: 18px;
    }
    .note {
      background: #fff8e1;
      border-left: 4px solid #f9a825;
      padding: 10px;
      text-align: left;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Eskane Kat Manm MEDFAH</h1>
    <p class="note">
      Pou anrejistre prezans yon manm, konekte nan
      <strong>Administration → Présences</strong> epi sèvi ak
      scanner ki nan seksyon sa a.
    </p>

    <div id="reader"></div>
    <div id="result" role="status">
      Ap prepare kamera a...
    </div>

    <a href="index.html" class="btn">Retounen nan Akèy la</a>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", async function () {
      const resultContainer = document.getElementById("result");
      let scanner = null;
      let alreadyScanned = false;

      if (!window.Html5Qrcode) {
        resultContainer.textContent =
          "Bibliyotèk QR la pa chaje. Verifye koneksyon entènèt la.";
        return;
      }

      scanner = new Html5Qrcode("reader");

      
async function onScanSuccess(decodedText) {
  if (alreadyScanned) return;
  alreadyScanned = true;

  try {
    const scannedUrl = new URL(String(decodedText || "").trim());

    // Aksepte sèlman lyen verifikasyon MEDFAH
    if (
      scannedUrl.origin !== window.location.origin ||
      !/\/verify\.html$/i.test(scannedUrl.pathname)
    ) {
      throw new Error("QR Code sa a pa yon lyen verifikasyon MEDFAH.");
    }

    const token = scannedUrl.searchParams.get("qr_token");

    if (!token) {
      throw new Error("QR Code la pa gen QR Token obligatwa a.");
    }

    resultContainer.textContent =
      "QR Code rekonèt. Ouvèti verifikasyon MEDFAH...";

    try {
      await scanner.stop();
      await scanner.clear();
    } catch (e) {
      console.warn("Kamera a pa t kapab fèmen:", e);
    }

    const verificationUrl = new URL(
      "verify.html",
      window.location.href
    );

    verificationUrl.searchParams.set("qr_token", token);

    window.location.assign(verificationUrl.href);

  } catch (error) {
    console.error(error);

    resultContainer.textContent =
      error.message || "QR Code la pa kapab verifye.";

    alreadyScanned = false;
  }
}

            // DEMARE KAMERA A
      try {
        resultContainer.textContent = "Ap limen kamera a...";

        await scanner.start(
          { facingMode: "environment" },
          {
            fps: 10,
            qrbox: { width: 250, height: 250 }
          },
          onScanSuccess,
          function (errorMessage) {
            // Kontinye chèche QR Code la
          }
        );

        resultContainer.textContent =
          "Kamera a limen. Mete QR Code MEDFAH la devan kamera a.";

            } catch (error) {
        console.error("Erè kamera MEDFAH:", error);

        resultContainer.textContent =
          "Kamera a pa kapab demare: " +
          (error.message || error);
      }

    }); // Fèmen DOMContentLoaded la
  </script>
</body>
</html>
