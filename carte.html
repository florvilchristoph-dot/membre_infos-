<script>

let db=null, members=[], visibleMembers=[];

const $=id=>document.getElementById(id);

function say(t){
 $("message").textContent=t;
}

function val(o,...keys){
 for(const k of keys){
  const x=o?.[k];
  if(x!==null&&x!==undefined&&String(x).trim()!==""){
   return String(x);
  }
 }
 return "";
}

function token(){
 return crypto?.randomUUID
  ?crypto.randomUUID()
  :"MEDFAH-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2);
}

function safe(s){
 return String(s??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[c]));
}

/* INITIALISATION ET AUTORISATION */

async function init(){

 try{

  if(
   !window.SUPABASE_URL||
   !window.SUPABASE_ANON_KEY||
   !window.supabase
  ){
   throw Error("Configuration Supabase introuvable.");
  }

  db=window.supabase.createClient(
   window.SUPABASE_URL,
   window.SUPABASE_ANON_KEY
  );

  const {data:s,error:se}=await db.auth.getSession();

  if(se)throw se;

  const uid=s?.session?.user?.id;

  if(!uid){
   throw Error("Connectez-vous d'abord dans Administration.");
  }

  const {data:r,error:re}=await db
   .from("medfah_user_roles")
   .select("role")
   .eq("user_id",uid)
   .maybeSingle();

  if(re)throw re;

  if(
   !r||
   !["admin_principal","admin_secondaire"].includes(r.role)
  ){
   throw Error("Accès réservé aux administrateurs autorisés.");
  }

  $("controls").classList.remove("hidden");

  say("Accès autorisé. Chargement des membres...");

  const {data,error}=await db
   .from("membre_infos")
   .select("*")
   .order("nom",{ascending:true});

  if(error)throw error;

  members=data||[];
  visibleMembers=members;

  fillSelect(members);

  say(members.length+" membre(s) chargé(s).");

 }catch(e){

  console.error(e);

  say("Erreur : "+(e.message||e));

 }

}

/* LISTE ET RECHERCHE DES MEMBRES */

function fillSelect(list){

 const s=$("memberSelect");

 s.innerHTML='<option value="">Choisir un membre</option>';

 list.forEach(m=>{

  const o=document.createElement("option");

  o.value=m.id;

  o.textContent=
   val(m,"nom")+" "+
   val(m,"prenom","prénom")+
   " — "+
   val(m,"code");

  s.appendChild(o);

 });

}

$("search").addEventListener("input",e=>{

 const q=e.target.value.toLocaleLowerCase("fr");

 visibleMembers=members.filter(m=>
  (
   val(m,"nom")+" "+
   val(m,"prenom","prénom")+" "+
   val(m,"code")
  ).toLocaleLowerCase("fr").includes(q)
 );

 fillSelect(visibleMembers);

});

 </span>

 <span class="church-contact">
 eglisedelafoiapostolique2007@gmail.com | (+509) 37897370 / 31048016
</span>

<span class="card-slogan">
 MEDFAH — « Une Église, une famille, une vision. »
</span>

<img

<div class="card-title">

  <div class="body">

}

/* CRÉATION DU QR CODE */

async function ensureToken(m){

 let t=val(m,"qr_token");

 if(t)return t;

 t=token();

 const {data,error}=await db
  .from("membre_infos")
  .update({
   qr_token:t,
   qr_code:t
  })
  .eq("id",m.id)
  .select("*")
  .single();

 if(error)throw error;

 Object.assign(m,data);

 return t;

}

/* AFFICHAGE DES CARTES AVEC PHOTOS PRIVÉES */

async function render(list){

 if(!list.length){
  say("Aucun membre à afficher.");
  return;
 }

 say("Préparation des photos et des cartes...");

 const cartesAvecPhotos = await Promise.all(
  list.map(async membre => {

   const copie = {...membre};
   const photo = val(copie,"photo");

   if(photo){

    if(/^https?:\/\//i.test(photo)){
     copie.photo = photo;
    }else{

     const {data,error} = await db.storage
      .from("medfah-photos")
      .createSignedUrl(photo,3600);

     if(error){
      console.warn("Photo indisponible :",error);
      copie.photo = "";
     }else{
      copie.photo = data.signedUrl;
     }

    }

   }

   return copie;

  })
 );

 $("cardsGrid").innerHTML =
  cartesAvecPhotos.map(cardHTML).join("");

 for(const m of list){

  const t = await ensureToken(m);

  const target = new URL("verify.html",location.href);

  target.searchParams.set("qr_token",t);

  const node = $("qr-"+m.id);

  if(node){

   node.innerHTML = "";

   new QRCode(node,{
    text:target.href,
    width:180,
    height:180,
    correctLevel:QRCode.CorrectLevel.H
   });

  }

 }

 say(
  list.length+
  " carte(s) prête(s). Vérifiez les photos avant impression."
 );

}

/* SÉLECTION D'UN MEMBRE */

async function selected(){

 const id=$("memberSelect").value;

 if(!id){
  throw Error("Choisissez d'abord un membre.");
 }

 const m=members.find(x=>String(x.id)===String(id));

 if(!m){
  throw Error("Membre introuvable.");
 }

 return m;

}

/* PRÉPARATION POUR TÉLÉCHARGEMENT JPG ET PDF */

function nomFichierCarte(m){
 return (
  "MEDFAH_"+val(m,"nom")+"_"+val(m,"prenom")
 )
 .normalize("NFD")
 .replace(/[\u0300-\u036f]/g,"")
 .replace(/[^a-zA-Z0-9_-]+/g,"_");
}

async function preparerCarteTelechargement(m){

 if(!window.html2canvas){
  throw Error("Le module de téléchargement JPG est indisponible.");
 }

 await render([m]);

 const carte=$("cardsGrid").querySelector(".member-card");

 if(!carte){
  throw Error("La carte du membre n'a pas été trouvée.");
 }

 const images=[...carte.querySelectorAll("img")];

 await Promise.all(images.map(img=>{

  if(img.complete){
   return Promise.resolve();
  }

  return new Promise(resolve=>{

   img.addEventListener("load",resolve,{once:true});
   img.addEventListener("error",resolve,{once:true});

   setTimeout(resolve,15000);

  });

 }));

 if(document.fonts&&document.fonts.ready){
  await document.fonts.ready;
 }

 return await html2canvas(carte,{
  scale:4,
  useCORS:true,
  allowTaint:false,
  backgroundColor:"#ffffff",
  logging:false,
  imageTimeout:20000
 });

}

/* TÉLÉCHARGEMENT JPG */

$("downloadJpg").onclick=async()=>{

 try{

  const m=await selected();

  say("Préparation de la carte en image haute qualité...");

  const canvas=await preparerCarteTelechargement(m);

  const lien=document.createElement("a");

  lien.download=nomFichierCarte(m)+".jpg";

  lien.href=canvas.toDataURL("image/jpeg",0.98);

  document.body.appendChild(lien);
  lien.click();
  lien.remove();

  say("Carte JPG téléchargée avec succès.");

 }catch(e){

  console.error(e);
  say("Erreur téléchargement JPG : "+e.message);

 }

};

/* TÉLÉCHARGEMENT PDF */

$("downloadPdf").onclick=async()=>{

 try{

  const m=await selected();

  say("Préparation du document PDF haute qualité...");

  const canvas=await preparerCarteTelechargement(m);

  const PDF = window.jspdf?.jsPDF || window.jsPDF;

if(!PDF){
 throw Error("La bibliothèque PDF n'a pas pu être chargée. Rechargez la page.");
}

  const image=canvas.toDataURL("image/jpeg",0.98);

  const jsPDF = PDF;

  const pdf=new jsPDF({
   orientation:"landscape",
   unit:"mm",
   format:[85.6,54]
  });

  pdf.addImage(
   image,
   "JPEG",
   0,
   0,
   85.6,
   54,
   undefined,
   "FAST"
  );

  pdf.save(nomFichierCarte(m)+".pdf");

  say("Carte PDF téléchargée avec succès.");

 }catch(e){

  console.error(e);
  say("Erreur téléchargement PDF : "+e.message);

 }

};

/* BOUTONS D'ACTION */

$("showOne").onclick=async()=>{

 try{
  await render([await selected()]);
 }catch(e){
  say(e.message);
 }

};

$("showAll").onclick=async()=>{

 try{
  await render(members);
 }catch(e){
  say("Erreur : "+e.message);
 }

};

$("printOne").onclick=async()=>{

 try{

  await render([await selected()]);

  setTimeout(()=>{
   window.print();
  },700);

 }catch(e){

  say("Erreur : "+e.message);

 }

};

$("printAll").onclick=async()=>{

 try{

  if(!members.length){
   throw Error("Aucun membre chargé.");
  }

  await render(members);

  setTimeout(()=>{
   window.print();
  },Math.max(1000,members.length*100));

 }catch(e){

  say("Erreur : "+e.message);

 }

};

/* DÉMARRAGE */

init();

</script>
